# Docker Compose stack (DOC-39). Always run through the root Makefile:
#   docker compose -f deploy/compose/compose.yaml --env-file deploy/versions.env --env-file .env ...
name: pti

x-logging: &default-logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

# TCP rather than the socket: during initdb the entrypoint runs a temporary socket-only server, and a socket probe
# would report healthy before the bootstrap scripts have created the roles and databases.
x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

# Shared by every Spring Boot app (DOC-39 §3.2). Jib images have bash but no curl, hence the /dev/tcp probe.
x-spring-app: &spring-app
  restart: unless-stopped
  stop_grace_period: 45s # > spring.lifecycle.timeout-per-shutdown-phase (30s)
  healthcheck:
    test: ["CMD", "bash", "-c",
      "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 30s
  logging: *default-logging

x-spring-env: &spring-env
  TZ: UTC
  JAVA_TOOL_OPTIONS: >-
    -XX:MaxRAMPercentage=75 -XX:+UseCompactObjectHeaders -XX:+ExitOnOutOfMemoryError
    -Duser.timezone=UTC
  SERVER_PORT: "8080"
  MANAGEMENT_SERVER_PORT: "9080"
  PTI_CLOCK_OFFSET: ${PTI_CLOCK_OFFSET:-0s}
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
  MANAGEMENT_TRACING_EXPORT_ENABLED: ${PTI_TRACING_ENABLED:-false}

services:
  # ---------------------------------------------------------------- infrastructure (core)

  pg-warehouse:
    profiles: [core]
    image: ${POSTGRES_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    # Parallel queries keep their shared memory in /dev/shm; Docker's 64 MB default is too small for the checksum
    # queries of EXP-04 (DOC-45) and the analytics recompute scans.
    shm_size: 256m
    command: >-
      postgres -c shared_buffers=512MB -c max_connections=100 -c work_mem=16MB -c maintenance_work_mem=128MB
      -c wal_level=replica -c max_wal_size=2GB -c log_min_duration_statement=500 -c timezone=UTC
    environment:
      POSTGRES_PASSWORD: ${PG_WAREHOUSE_SUPERUSER_PASSWORD:?run make secrets}
      PTI_OWNER_PASSWORD: ${PTI_OWNER_PASSWORD:?run make secrets}
      ETL_WRITER_PASSWORD: ${ETL_WRITER_PASSWORD:?run make secrets}
      TRIAGE_WRITER_PASSWORD: ${TRIAGE_WRITER_PASSWORD:?run make secrets}
      API_READER_PASSWORD: ${API_READER_PASSWORD:?run make secrets}
      REPLAY_OPERATOR_PASSWORD: ${REPLAY_OPERATOR_PASSWORD:?run make secrets}
      EXPERIMENT_RUNNER_PASSWORD: ${EXPERIMENT_RUNNER_PASSWORD:?run make secrets}
    volumes:
      - pg-warehouse-data:/var/lib/postgresql/data
      - ./postgres/warehouse:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${HOST_PORT_PG_WAREHOUSE:-15432}:5432"]
    healthcheck: *postgres-healthcheck
    mem_limit: 1536m
    cpus: 2.0
    logging: *default-logging

  pg-source:
    profiles: [core]
    image: ${POSTGRES_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    shm_size: 256m
    command: >-
      postgres -c wal_level=logical -c max_replication_slots=4 -c max_wal_senders=4 -c max_slot_wal_keep_size=4GB
      -c shared_buffers=64MB -c max_connections=50 -c timezone=UTC
    environment:
      POSTGRES_PASSWORD: ${PG_SOURCE_SUPERUSER_PASSWORD:?run make secrets}
      TICKETING_OWNER_PASSWORD: ${TICKETING_OWNER_PASSWORD:?run make secrets}
      SIM_OWNER_PASSWORD: ${SIM_OWNER_PASSWORD:?run make secrets}
      SOURCE_SIMULATOR_PASSWORD: ${SOURCE_SIMULATOR_PASSWORD:?run make secrets}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?run make secrets}
      EXPERIMENT_RUNNER_PASSWORD: ${EXPERIMENT_RUNNER_PASSWORD:?run make secrets}
    volumes:
      - pg-source-data:/var/lib/postgresql/data
      - ./postgres/source:/docker-entrypoint-initdb.d:ro
    ports: ["127.0.0.1:${HOST_PORT_PG_SOURCE:-15433}:5432"]
    healthcheck: *postgres-healthcheck
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  kafka:
    profiles: [core]
    image: ${KAFKA_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${HOST_PORT_KAFKA:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?run make secrets}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafka-data:/var/lib/kafka/data
    ports: ["127.0.0.1:${HOST_PORT_KAFKA:-19092}:19092"]
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    mem_limit: 1024m
    cpus: 1.0
    logging: *default-logging

  kafka-init:
    profiles: [core]
    image: ${KAFKA_IMAGE:?deploy/versions.env is not loaded}
    restart: "no"
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/create-topics.sh", "/topics.yaml"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_HEAP_OPTS: -Xmx128m
    volumes:
      - ../topics.yaml:/topics.yaml:ro
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    mem_limit: 256m
    logging: *default-logging

  seaweedfs:
    profiles: [core]
    image: ${SEAWEEDFS_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command: >-
      server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333
      -master.volumeSizeLimitMB=1024 -volume.max=0
    volumes:
      - seaweedfs-data:/data
      - ./.generated/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:${HOST_PORT_S3:-18333}:8333"
      - "127.0.0.1:${HOST_PORT_S3_FILER:-18888}:8888"
    healthcheck:
      # 8333 answers 403 to unsigned requests; any HTTP status line means the S3 gateway is up.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null && wget -S --spider http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  s3-init:
    profiles: [core]
    image: ${AWS_CLI_IMAGE:?deploy/versions.env is not loaded}
    restart: "no"
    depends_on:
      seaweedfs: { condition: service_healthy }
    entrypoint: ["bash", "/s3-init/s3-init.sh"]
    environment:
      S3_ADMIN_ACCESS_KEY: ${S3_ADMIN_ACCESS_KEY:?run make secrets}
      S3_ADMIN_SECRET_KEY: ${S3_ADMIN_SECRET_KEY:?run make secrets}
      S3_ETL_ACCESS_KEY: ${S3_ETL_ACCESS_KEY:?run make secrets}
      S3_ETL_SECRET_KEY: ${S3_ETL_SECRET_KEY:?run make secrets}
    volumes:
      - ./seaweedfs:/s3-init:ro
    mem_limit: 128m
    logging: *default-logging

  db-migrate:
    profiles: [core]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-db-migrate:${PTI_IMAGE_TAG:-local}
    restart: "no"
    depends_on:
      pg-warehouse: { condition: service_healthy }
      pg-source: { condition: service_healthy }
    environment:
      PTI_OWNER_PASSWORD: ${PTI_OWNER_PASSWORD:?run make secrets}
      TICKETING_OWNER_PASSWORD: ${TICKETING_OWNER_PASSWORD:?run make secrets}
      SIM_OWNER_PASSWORD: ${SIM_OWNER_PASSWORD:?run make secrets}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
    mem_limit: 384m
    cpus: 1.0
    logging: *default-logging

  kafka-connect:
    profiles: [core]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-connect:${PTI_IMAGE_TAG:-local}
    build:
      context: ../connect
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: pti-connect
      CONFIG_STORAGE_TOPIC: connect-configs
      OFFSET_STORAGE_TOPIC: connect-offsets
      STATUS_STORAGE_TOPIC: connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      CONNECT_CONFIG_PROVIDERS_ENV_PARAM_ALLOWLIST_PATTERN: ^(DEBEZIUM_PASSWORD|S3_CONNECT_.*)$$
      # Aiven S3 sink 3.4.3 cuts a file per partition every 10 s and keeps each writer's part buffer until the next
      # commit; a 30 s commit keeps that to about 3 x partitions x 1 MiB (DR-89).
      CONNECT_OFFSET_FLUSH_INTERVAL_MS: 30000
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD:?run make secrets}
      S3_CONNECT_ACCESS_KEY: ${S3_CONNECT_ACCESS_KEY:?run make secrets}
      S3_CONNECT_SECRET_KEY: ${S3_CONNECT_SECRET_KEY:?run make secrets}
      HEAP_OPTS: -Xms256m -Xmx512m
    ports: ["127.0.0.1:${HOST_PORT_CONNECT:-18083}:8083"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 1280m
    cpus: 1.0
    logging: *default-logging

  kafka-connect-init:
    profiles: [core]
    image: ${CURL_IMAGE:?deploy/versions.env is not loaded}
    restart: "no"
    depends_on:
      kafka-connect: { condition: service_healthy }
      pg-source: { condition: service_healthy }
      # Debezium needs the pti_ticketing publication and the heartbeat table from the ticketing migration.
      db-migrate: { condition: service_completed_successfully }
    entrypoint: ["/bin/sh", "/register.sh"]
    volumes:
      - ./connect/register.sh:/register.sh:ro
      - ../connect/connectors:/connectors:ro
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging

  # start-dev with the embedded H2 and no volume: every new container imports realm-pti.json again, so the realm always
  # matches the committed file (DOC-39 §3.1). ${...} placeholders in the JSON are resolved by Keycloak from these
  # variables. KC_HOSTNAME is the URL the browser sees and becomes the token issuer; the backchannel (JWKS) stays on
  # keycloak:8080 (DOC-27 §3.2).
  keycloak:
    profiles: [core]
    image: ${KEYCLOAK_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run make secrets}
      KC_HOSTNAME: http://localhost:${HOST_PORT_KEYCLOAK:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
      # Read by realm-pti.json. The demo passwords are public by design (DOC-27 AR-01); an empty value in .env
      # falls back to the user name.
      KEYCLOAK_EXPERIMENTS_CLIENT_SECRET: ${KEYCLOAK_EXPERIMENTS_CLIENT_SECRET:?run make secrets}
      KEYCLOAK_DEMO_VIEWER_PASSWORD: ${KEYCLOAK_DEMO_VIEWER_PASSWORD:-viewer}
      KEYCLOAK_DEMO_OPERATOR_PASSWORD: ${KEYCLOAK_DEMO_OPERATOR_PASSWORD:-operator}
    volumes:
      - ./keycloak/realm-pti.json:/opt/keycloak/data/import/realm-pti.json:ro
    ports: ["127.0.0.1:${HOST_PORT_KEYCLOAK:-8180}:8080"]
    healthcheck:
      # The image has no curl; Keycloak 26 serves /health/ready on the management port 9000.
      test: ["CMD", "bash", "-c",
        "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      retries: 18
      start_period: 30s
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging

  # ---------------------------------------------------------------- apps (core)

  source-simulator:
    <<: *spring-app
    profiles: [core]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-source-simulator:${PTI_IMAGE_TAG:-local}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
    environment:
      <<: *spring-env
      SPRING_PROFILES_INCLUDE: ${PTI_EXTRA_PROFILES:-}
      PTI_DATASOURCE_TICKETING_URL: jdbc:postgresql://pg-source:5432/ticketing_source
      PTI_DATASOURCE_SIM_URL: jdbc:postgresql://pg-source:5432/pti_sim
      SOURCE_SIMULATOR_PASSWORD: ${SOURCE_SIMULATOR_PASSWORD:?run make secrets}
      PTI_SIM_FEED_LOCATION: file:/feed/metrotransit-mn-20260926.zip
      # Paused by default; `make sim-start` turns it on (DR-86).
      PTI_SIM_RATE_MULTIPLIER_GTFS_RT: ${PTI_SIM_START_RATE:-0}
      PTI_SIM_RATE_MULTIPLIER_TICKETING: ${PTI_SIM_START_RATE:-0}
    volumes:
      - ../../sample-data/gtfs:/feed:ro
    ports:
      - "127.0.0.1:${HOST_PORT_SIM:-8084}:8080"
      - "127.0.0.1:9084:9080"
    mem_limit: 512m
    cpus: 1.0

  etl-stream:
    <<: *spring-app
    profiles: [core]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-etl:${PTI_IMAGE_TAG:-local}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
    environment:
      <<: *spring-env
      SPRING_PROFILES_ACTIVE: stream${PTI_ETL_EXTRA_PROFILES:-}
      # Fault injection of EXP-01 `halt` (profile experiment only, DOC-19 §8); empty is ignored.
      SPRING_APPLICATION_JSON: ${PTI_ETL_APPLICATION_JSON:-}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${PTI_WAREHOUSE_HOST:-pg-warehouse}:5432/pti_warehouse
      ETL_WRITER_PASSWORD: ${ETL_WRITER_PASSWORD:?run make secrets}
      PTI_DQ_MAX_CLOCK_SKEW: ${PTI_DQ_MAX_CLOCK_SKEW:-1h}
    healthcheck:
      test: ["CMD", "bash", "-c",
        "exec 3<>/dev/tcp/127.0.0.1/9080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 3s
      retries: 12
      # Readiness waits for the first ACTIVE feed, which etl-batch loads on the first start (DOC-21 §1).
      start_period: 180s
    ports: ["127.0.0.1:9082:9080"]
    mem_limit: 768m
    cpus: 2.0

  etl-batch:
    <<: *spring-app
    profiles: [core]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-etl:${PTI_IMAGE_TAG:-local}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
      s3-init: { condition: service_completed_successfully }
    environment:
      <<: *spring-env
      SPRING_PROFILES_ACTIVE: batch
      SPRING_DATASOURCE_URL: jdbc:postgresql://pg-warehouse:5432/pti_warehouse
      ETL_WRITER_PASSWORD: ${ETL_WRITER_PASSWORD:?run make secrets}
      PTI_S3_ENDPOINT: http://seaweedfs:8333
      PTI_S3_ACCESS_KEY: ${S3_ETL_ACCESS_KEY:?run make secrets}
      PTI_S3_SECRET_KEY: ${S3_ETL_SECRET_KEY:?run make secrets}
      SPRING_CLOUD_AWS_S3_PATH_STYLE_ACCESS_ENABLED: "true"
      SPRING_CLOUD_AWS_REGION_STATIC: us-east-1
      # EXP-04 rebuilds from the raw zone copy instead: s3://raw/gtfs-static/<sha256>.zip (DOC-45 EXP-04 step 6).
      PTI_GTFS_BOOTSTRAP_LOCATION: ${PTI_GTFS_BOOTSTRAP_LOCATION:-file:/feed/metrotransit-mn-20260926.zip}
    volumes:
      - ../../sample-data/gtfs:/feed:ro
    ports: ["127.0.0.1:9083:9080"]
    mem_limit: 640m
    cpus: 1.0

  # The only entry point of the frontend (DOC-39 §3.4). Two pools on the warehouse: api_reader for reads,
  # replay_operator for writes (DOC-29 §3.1). JWKS comes over the internal network, the issuer is the URL the browser
  # sees (DOC-27 §3.2). Demo endpoints (E-90) come with PTI_EXTRA_PROFILES=demo.
  api:
    <<: *spring-app
    profiles: [core]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-api:${PTI_IMAGE_TAG:-local}
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      db-migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }
    environment:
      <<: *spring-env
      SPRING_PROFILES_INCLUDE: ${PTI_EXTRA_PROFILES:-}
      PTI_DATASOURCE_READER_URL: jdbc:postgresql://pg-warehouse:5432/pti_warehouse
      PTI_DATASOURCE_OPERATOR_URL: jdbc:postgresql://pg-warehouse:5432/pti_warehouse
      API_READER_PASSWORD: ${API_READER_PASSWORD:?run make secrets}
      REPLAY_OPERATOR_PASSWORD: ${REPLAY_OPERATOR_PASSWORD:?run make secrets}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/pti/protocol/openid-connect/certs
      PTI_API_SECURITY_ISSUER: http://localhost:${HOST_PORT_KEYCLOAK:-8180}/realms/pti
      PTI_API_ALERT_WEBHOOK_TOKEN_FILE: /run/secrets/alertmanager-webhook-token
      PTI_API_SIM_BASE_URL: http://source-simulator:8080
      PTI_API_LINKS_GRAFANA_URL: http://localhost:${HOST_PORT_GRAFANA:-3000}
    volumes:
      - ./.generated/webhook-token:/run/secrets/alertmanager-webhook-token:ro
    ports:
      - "127.0.0.1:${HOST_PORT_API:-8081}:8080"
      - "127.0.0.1:9081:9080"
    mem_limit: 640m
    cpus: 1.0

  # SPA and same-origin proxy to the api (DOC-39, DOC-26 §10). PTI_* become /env.js and the CSP at startup (P5-15).
  frontend:
    profiles: [core]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-frontend:${PTI_IMAGE_TAG:-local}
    build:
      context: ../../frontend
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    environment:
      PTI_KEYCLOAK_URL: http://localhost:${HOST_PORT_KEYCLOAK:-8180}
      PTI_KEYCLOAK_REALM: pti
      PTI_KEYCLOAK_CLIENT_ID: pti-web
      PTI_MAP_STYLE: ${PTI_MAP_STYLE:-offline}
      # Empty with the local PMTiles; the tile server's origin when PTI_MAP_STYLE=online (ADR-0021).
      PTI_MAP_TILE_ORIGINS: ${PTI_MAP_TILE_ORIGINS:-}
      PTI_EXTRA_PROFILES: ${PTI_EXTRA_PROFILES:-}
      # The "Grafana" button of Pipeline (screens/ops-console-jobs §4); a link only, so not in the CSP.
      PTI_GRAFANA_URL: http://localhost:${HOST_PORT_GRAFANA:-3000}
    volumes:
      - ../tiles:/usr/share/nginx/html/tiles:ro
    ports: ["127.0.0.1:${HOST_PORT_FRONTEND:-8080}:80"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 32m
    cpus: 0.25
    logging: *default-logging

  # ---------------------------------------------------------------- experiment (DOC-45, DR-27)

  # Network faults between the ETL and the warehouse (DOC-39 §3.6): make up-exp points etl-stream and the baseline at
  # toxiproxy:5432. The image is distroless, so there is no healthcheck; the runner checks the API on 8474.
  toxiproxy:
    profiles: [experiment]
    image: ${TOXIPROXY_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports: ["127.0.0.1:${HOST_PORT_TOXIPROXY:-8474}:8474"]
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging

  etl-stream-baseline:
    <<: *spring-app
    profiles: [experiment]
    image: ghcr.io/${GHCR_OWNER:-ninggiangboy}/pti-etl:${PTI_IMAGE_TAG:-local}
    # Runs together with core (make up-exp); required: false keeps `--profile experiment` alone a valid project.
    depends_on:
      kafka-init: { condition: service_completed_successfully, required: false }
      db-migrate: { condition: service_completed_successfully, required: false }
    environment:
      <<: *spring-env
      SPRING_PROFILES_ACTIVE: stream,experiment
      SPRING_DATASOURCE_URL: jdbc:postgresql://${PTI_WAREHOUSE_HOST:-pg-warehouse}:5432/pti_warehouse
      ETL_WRITER_PASSWORD: ${ETL_WRITER_PASSWORD:?run make secrets}
      # Only the two GTFS-realtime listeners run, in group pti-exp-baseline, writing exp.exp_fact_* (DOC-20 §9).
      PTI_ETL_BASELINE_OFFSET_COMMIT: ${PTI_ETL_BASELINE_OFFSET_COMMIT:-auto}
      PTI_ETL_BASELINE_ERROR_MODE: ${PTI_ETL_BASELINE_ERROR_MODE:-fail-batch}
      PTI_ETL_BASELINE_WRITE_MODE: ${PTI_ETL_BASELINE_WRITE_MODE:-insert}
      PTI_ETL_BASELINE_DEDUP: ${PTI_ETL_BASELINE_DEDUP:-off}
    ports: ["127.0.0.1:9086:9080"]
    mem_limit: 768m
    cpus: 2.0

  # ---------------------------------------------------------------- observability (DOC-39 §3.7, DOC-28)

  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:${HOST_PORT_PROMETHEUS:-9090}:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  alertmanager:
    profiles: [observability]
    image: ${ALERTMANAGER_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./.generated/webhook-token:/etc/alertmanager/webhook-token:ro
      - alertmanager-data:/alertmanager
    ports: ["127.0.0.1:${HOST_PORT_ALERTMANAGER:-9093}:9093"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging

  grafana:
    profiles: [observability]
    image: ${GRAFANA_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    depends_on:
      prometheus: { condition: service_healthy }
      loki: { condition: service_started }
      tempo: { condition: service_started }
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make secrets}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Read by the Warehouse datasource (provisioning/datasources/datasources.yml).
      API_READER_PASSWORD: ${API_READER_PASSWORD:?run make secrets}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:${HOST_PORT_GRAFANA:-3000}:3000"]
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  # Loki, Tempo and the OTel Collector ship distroless images without a shell or HTTP client, so they have no
  # healthcheck; Prometheus scrapes each of them, and `up` shows whether they answer.
  loki:
    profiles: [observability]
    image: ${LOKI_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  tempo:
    profiles: [observability]
    image: ${TEMPO_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    mem_limit: 384m
    cpus: 0.5
    logging: *default-logging

  otel-collector:
    profiles: [observability]
    image: ${OTEL_COLLECTOR_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yml"]
    volumes:
      - ./observability/otel-collector/config.yml:/etc/otelcol/config.yml:ro
    mem_limit: 192m
    cpus: 0.5
    logging: *default-logging

  alloy:
    profiles: [observability]
    image: ${ALLOY_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Reads the logs of the pti containers (DR-50); the image runs as root, which the socket requires.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["127.0.0.1:${HOST_PORT_ALLOY:-12345}:12345"]
    healthcheck:
      test: ["CMD", "bash", "-c",
        "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ' 200 ' <&3"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 192m
    cpus: 0.5
    logging: *default-logging

  mailpit:
    profiles: [observability]
    image: ${MAILPIT_IMAGE:?deploy/versions.env is not loaded}
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports: ["127.0.0.1:${HOST_PORT_MAILPIT:-8025}:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 64m
    cpus: 0.25
    logging: *default-logging

volumes:
  pg-warehouse-data:
  pg-source-data:
  kafka-data:
  seaweedfs-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
