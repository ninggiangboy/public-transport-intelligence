# Spike S-05: tile location block as planned for the frontend image (ADR-0021), plus the DOC-27 CSP without blob: workers.
server {
  listen 80;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;
  types { text/javascript mjs; }
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; worker-src 'self'; connect-src 'self'" always;
  location /tiles/ {
    add_header Cache-Control "public, max-age=86400";
    add_header Content-Security-Policy "default-src 'self'" always;
  }
}
