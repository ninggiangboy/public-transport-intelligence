[project]
name = "pti-exp"
version = "0.1.0"
description = "Experiment runner for the Public Transport Intelligence pipeline (DOC-45, ADR-0025)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docker>=7.1",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
pti-exp = "pti_exp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pti_exp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Docs and messages use typographic dashes, minus and multiplication signs on purpose.
ignore = ["RUF001", "RUF002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
