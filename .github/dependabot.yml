# Weekly dependency updates (DOC-41 §8). Ecosystems are added as their directories appear.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /backend
    schedule:
      interval: weekly
    groups:
      spring-boot:
        patterns: ["org.springframework*", "io.awspring*"]
      testcontainers:
        patterns: ["org.testcontainers*"]
      others:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      tanstack:
        patterns: ["@tanstack/*"]
      dev-dependencies:
        dependency-type: development
