# Fast checks that decide whether a change can be merged (DOC-41 §2).
name: pr

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      experiments: ${{ steps.filter.outputs.experiments }}
      deploy: ${{ steps.filter.outputs.deploy }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/topics.yaml'
              - 'deploy/connect/**'
              - '.github/workflows/pr.yml'
            frontend:
              - 'frontend/**'
              - 'backend/api/openapi.json'
            experiments:
              - 'experiments/**'
            deploy:
              - 'deploy/**'
            docs:
              - 'docs/**'

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: java
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew spotlessCheck checkstyleMain checkstyleTest checkstyleTestFixtures checkstyleIntegrationTest

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: java
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and unit test
        run: ./gradlew build
      - name: Integration tests of affected modules
        env:
          # Pull requests test what changed against the target branch; pushes test what the push changed.
          AFFECTED_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if git cat-file -e "${AFFECTED_BASE}^{commit}" 2>/dev/null; then
            ./gradlew affectedIntegrationTest -PaffectedBase="$AFFECTED_BASE"
          else
            ./gradlew integrationTest
          fi
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: |
            backend/*/build/reports/
            backend/*/build/test-results/
          retention-days: 7

  experiments:
    needs: changes
    if: needs.changes.outputs.experiments == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: python uv
      - name: Ruff and pytest (P3-06)
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest -q

  compose-config:
    needs: changes
    if: needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          install_args: shellcheck
      - name: Compose config is valid for every profile (C-01)
        run: |
          deploy/compose/scripts/secrets.sh
          for profile in core observability triage experiment tools '*'; do
            docker compose -f deploy/compose/compose.yaml --env-file deploy/versions.env --env-file .env \
              --profile "$profile" config -q
            echo "profile $profile: ok"
          done
      - name: Prometheus rules and their tests (DOC-28 O-03)
        run: |
          image=$(sed -n 's/^PROMETHEUS_IMAGE=//p' deploy/versions.env)
          prom="docker run --rm -v $PWD/deploy/compose/observability/prometheus:/p:ro --entrypoint promtool $image"
          $prom check config /p/prometheus.yml
          $prom check rules /p/rules/pti-recording.yml /p/rules/pti-alerts.yml
          docker run --rm -v "$PWD/deploy/compose/observability/prometheus:/p:ro" -w /p/tests \
            --entrypoint promtool "$image" test rules pti-alerts.test.yml
      - name: Shell scripts
        run: git ls-files -z 'deploy/**/*.sh' | xargs -0 --no-run-if-empty shellcheck
      - name: .env.example holds names only
        run: |
          if grep -nE '^[A-Z0-9_]+=.+' deploy/compose/.env.example; then
            echo "::error file=deploy/compose/.env.example::.env.example must not contain values"
            exit 1
          fi

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v4
        with:
          install_args: gitleaks
      - run: gitleaks git --redact --no-banner --config .gitleaks.toml

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
