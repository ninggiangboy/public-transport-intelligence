# source-simulator (DOC-25 §11, DOC-29). Secrets and hosts come from the environment (DOC-39).
spring:
  application:
    name: source-simulator
  main:
    banner-mode: off
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 30s
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      compression-type: zstd
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        linger.ms: 20
        max.block.ms: 1000
        delivery.timeout.ms: 120000
    template:
      observation-enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  server:
    port: 9080
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    enabled: ${PTI_TRACING_ENABLED:false}

logging:
  structured:
    format:
      console: ecs

pti:
  clock:
    offset: 0s
  datasource:
    ticketing:
      url: jdbc:postgresql://localhost:5432/ticketing_source
      username: source_simulator
      password: ${SOURCE_SIMULATOR_PASSWORD:}
      hikari:
        pool-name: ticketing
        maximum-pool-size: 4
    sim:
      url: jdbc:postgresql://localhost:5432/pti_sim
      username: source_simulator
      password: ${SOURCE_SIMULATOR_PASSWORD:}
      hikari:
        pool-name: sim
        maximum-pool-size: 4
        data-source-properties:
          reWriteBatchedInserts: true
  sim:
    seed: 42
    service-date-mapping: auto
    feed:
      location: file:/data/gtfs/metrotransit-mn-20260926.zip
      sha256: 2cfc4a1b6efd7e860cbc0ee4bc90487fb8a5eb3f7946b35df021569d032ee23b
    tick: 200ms
    gps-noise: 5
    vehicle-position:
      interval: 5s
      v2-ratio: 0.5
    trip-update:
      interval: 30s
      lookahead-stops: 10
    vehicle:
      min-layover: 10m
      max-layover-emit: 30m
    delay:
      initial-mean:
        peak: 60s
        off-peak: 20s
      initial-sd:
        peak: 45s
        off-peak: 30s
      drift:
        peak: -8s
        off-peak: -5s
      segment-sd:
        peak: 12s
        off-peak: 8s
      dwell-mean:
        peak: 8s
        off-peak: 5s
      early-limit: -120s
      late-limit: 1200s
      min-speed-ratio: 0.5
    route-factor:
      phi: 0.8
      sigma: 0.15
      bucket: 5m
    rate-multiplier:
      gtfs-rt: 1.0
      ticketing: 1.0
    ledger:
      queue-capacity: 50000
      batch-size: 500
      flush-interval: 200ms
      retention: 2d
    scenario:
      max-duration: 2h
    duplicates:
      queue-capacity: 200000
    ticketing:
      fare:
        single: 2.00
        single-peak: 2.50
        day: 5.00
        month: 76.00
      mix:
        SINGLE: 0.80
        DAY: 0.15
        MONTH: 0.05
      refund-ratio: 0.01
      void-ratio: 0.002
      delete-ratio: 0.0005
      kiosk-count: 60
      # Sales per second for each hour 00..23, America/Chicago (DOC-25 §9.2).
      rate-profile: [0.05, 0.05, 0.05, 0.05, 0.05, 0.3, 1.2, 2.0, 1.6, 0.9, 0.8, 0.8, 0.8, 0.8, 0.9, 1.4, 2.0, 1.8, 1.1, 0.7, 0.5, 0.35, 0.25, 0.1]
      weekend-factor: 0.6
      customer-pool: 50000
