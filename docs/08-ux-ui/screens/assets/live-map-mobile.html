  .dchip small { font-size: 11.5px; color: var(--muted-foreground); font-weight: 500; letter-spacing: 0; }
  .tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--card); border-top: 1px solid var(--border); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }

  .tbadge { position: absolute; top: 8px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 999px; background: var(--destructive); color: #fff; font-size: 10px; font-weight: 600; display: grid; place-items: center; }
